[package]
name = "arriendos"
version = "0.1.0"
description = "Organizador personal de departamentos"
edition = "2021"

[lib]
name = "arriendos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
# Tauri CLI enables this for release builds to embed local web assets.
custom-protocol = ["tauri/custom-protocol"]
