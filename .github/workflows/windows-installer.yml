name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 11 compatible · x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Preparar directorio de instalación de prueba
        run: '"INSTALL_DIRECTORY=$env:RUNNER_TEMP\Arriendos" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependencias JS bloqueadas
        run: npm ci
      - name: Pruebas y compilación web
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Probar migración compatible con la base original
        run: |
          $output = python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1
          $code = $LASTEXITCODE
          $output | Out-String | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($code -ne 0) { exit $code }
      - name: Verificar resolución de dependencias nativas
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml > $null
      - name: Recuperar instalador publicado 0.1.0
        id: previous-installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Arriendos-Windows-x64
          run-id: 39518584442
          github-token: ${{ github.token }}
          path: .ci-previous-installer
      - name: Descargar código 0.1.0 si el instalador publicado ya expiró
        if: steps.previous-installer.outcome != 'success'
        uses: actions/checkout@v4
        with:
          ref: a7dc2f31a4e652977c5975631fad174abcbbe341
          path: .ci-previous
          persist-credentials: false
      - name: Compilar instalador 0.1.0 sólo si es necesario
        if: steps.previous-installer.outcome != 'success'
        run: |
          npm ci --prefix .ci-previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target'
          Push-Location .ci-previous
          npm run tauri build -- --bundles nsis --ci -- --locked
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
      - name: Instalar 0.1.0 y guardar tres departamentos en SQLite
        run: |
          if (Test-Path '.ci-previous-installer/SHA256SUMS.txt') {
            $baseline = Get-ChildItem .ci-previous-installer/*0.1.0*setup.exe
            if (@($baseline).Count -ne 1) { throw 'Instalador publicado 0.1.0 no encontrado' }
            $expected = ((Get-Content .ci-previous-installer/SHA256SUMS.txt).Trim() -split '\s+')[0]
            $actual = (Get-FileHash $baseline.FullName -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw 'El SHA256 del instalador publicado no coincide' }
          } else {
            $baseline = Get-ChildItem src-tauri/target/release/bundle/nsis/*0.1.0*setup.exe
          }
          if (@($baseline).Count -ne 1) { throw 'Se esperaba exactamente un instalador base' }
          ./scripts/install-windows.ps1 -Installer $baseline.FullName -InstallDirectory $env:INSTALL_DIRECTORY
          npm run test:windows -- "$env:INSTALL_DIRECTORY\arriendos.exe" seed 2>&1 | Tee-Object -Variable smokeOutput
          $code = $LASTEXITCODE
          $smokeOutput | Out-String >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }
      - name: Compilar instalador final de Windows con WebView2 offline
        run: npm run tauri build -- --bundles nsis --ci -- --locked
      - name: Actualizar instalación y verificar conservación de departamentos
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${version}_*setup.exe"
          if (@($installer).Count -ne 1) { throw 'Se esperaba exactamente un instalador final' }
          ./scripts/install-windows.ps1 -Installer $installer.FullName -InstallDirectory $env:INSTALL_DIRECTORY
          npm run test:windows -- "$env:INSTALL_DIRECTORY\arriendos.exe" upgrade 2>&1 | Tee-Object -Variable smokeOutput
          $code = $LASTEXITCODE
          $smokeOutput | Out-String >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item $installer.FullName installer/
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content -Encoding ascii installer/SHA256SUMS.txt
          Copy-Item docs/INSTALAR-WINDOWS.md installer/LEEME.md
      - name: Guardar evidencias de las pruebas nativas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-windows
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar archivo descargable del instalador verificado
        uses: actions/upload-artifact@v4
        with:
          name: Arriendos-Windows-x64
          path: installer/
          if-no-files-found: error
          retention-days: 90
